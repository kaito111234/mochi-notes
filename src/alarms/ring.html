<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src blob: data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo thức</title>
<link rel="stylesheet" href="ring.css">
</head>
<body>
<main class="card" role="alertdialog" aria-labelledby="time" aria-describedby="label">
  <div class="top">
    <span class="bell" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
    </span>
    <span class="kind" id="kind">Báo thức</span>
    <span class="more" id="more" hidden></span>
  </div>
  <div class="time" id="time">--:--</div>
  <div class="label" id="label"></div>
  <div class="line" id="line" hidden></div>
  <div class="status" id="status" hidden>Đã im chuông</div>
  <div class="actions">
    <button class="btn primary" id="stop" type="button">Tắt</button>
    <button class="btn" id="snooze" type="button">Hoãn 10 phút</button>
  </div>
</main>
<script src="ring.js"></script>
</body>
</html>
