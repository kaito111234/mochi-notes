<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: blob:; connect-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Mochi nhắc to</title>
<link rel="stylesheet" href="alert.css">
</head>
<body>
<div id="root">
  <div id="dim"></div>
  <div id="shake">
    <div id="char">
      <div id="outBack" class="outfit" aria-hidden="true"></div>
      <canvas id="cv"></canvas>
      <div id="face" aria-hidden="true"></div>
      <div id="outFront" class="outfit" aria-hidden="true"></div>
    </div>
    <div id="note">
      <div id="sheet">
        <div class="strip"></div>
        <div class="kicker" id="kicker"></div>
        <div class="ttl" id="ttl"></div>
        <div class="tm" id="tm"></div>
        <div class="late" id="late"></div>
      </div>
    </div>
    <div id="hands" aria-hidden="true"></div>
    <div id="prints" aria-hidden="true"></div>
    <div id="words" aria-hidden="true"></div>
    <div id="say"></div>
  </div>
  <div id="hint">Bấm vào bé để tắt</div>
</div>
<script src="../shared/outfit.js"></script>
<script src="../shared/wear.js"></script>
<script src="../pet/anim.js"></script>
<script src="alert.js"></script>
</body>
</html>
