<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: blob:; connect-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Bé Mochi</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="root">
  <div id="shaker">
    <canvas id="cv"></canvas>
    <div id="note" hidden>
      <div id="sheet">
        <div class="strip"></div>
        <div class="body">
          <div class="big" id="nBig"></div>
          <div class="ttl" id="nTitle"></div>
          <div class="meta" id="nMeta"></div>
        </div>
        <div class="curl"></div>
      </div>
    </div>
  </div>
  <div id="bubble" hidden>
    <div id="bText"><span id="bShown"></span><span id="bRest"></span></div>
    <div id="bBtns"></div>
    <div class="tail" id="bTail"></div>
  </div>
  <div id="cap" hidden>
    <label id="capLabel" for="capText">Cậu muốn tớ ghi gì?</label>
    <textarea id="capText" rows="1" maxlength="2000" spellcheck="false"></textarea>
    <div id="capFoot">
      <span id="capHint">Enter để lưu · Esc để huỷ</span>
      <button type="button" class="btn primary" id="capSave">Lưu</button>
      <button type="button" class="btn" id="capCancel">Huỷ</button>
    </div>
    <div class="tail" id="capTail"></div>
  </div>
</div>
<script src="anim.js"></script>
<script src="pet.js"></script>
</body>
</html>
