<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data: blob:; connect-src 'self' file: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Bé Mochi</title>
<link rel="stylesheet" href="pet.css">
</head>
<body>
<div id="root">
  <div id="shaker">
    <div id="groundProps" aria-hidden="true"></div>
    <div id="bedBack" class="bedBox" hidden aria-hidden="true"></div>
    <div id="turn">
    <div id="actor">
      <div id="outBack" class="outfit" aria-hidden="true"></div>
      <canvas id="cv"></canvas>
      <div id="outFront" class="outfit" aria-hidden="true"></div>
      <div id="propFront" aria-hidden="true"></div>
      <div id="ball" hidden aria-hidden="true"></div>
    </div>
    </div>
    <div id="bedFront" class="bedBox" hidden aria-hidden="true"></div>
    <div id="note" hidden>
      <div id="sheet">
        <div class="strip"></div>
        <div class="body">
          <div class="big" id="nBig"></div>
          <div class="ttl" id="nTitle"></div>
          <div class="meta" id="nMeta"></div>
        </div>
        <div class="curl"></div>
      </div>
    </div>
  </div>
  <div id="fx" aria-hidden="true"></div>
  <div id="bubble" hidden>
    <div id="bText"><span id="bShown"></span><span id="bRest"></span></div>
    <div id="bBtns"></div>
    <div class="tail" id="bTail"></div>
  </div>
</div>
<script src="../shared/outfit.js"></script>
<script src="../shared/wear.js"></script>
<script src="anim.js"></script>
<script src="props.js"></script>
<script src="pet.js"></script>
</body>
</html>
