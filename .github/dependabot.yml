# Dependabot: tự đề xuất PR cập nhật thư viện (mỗi tuần, thứ Hai).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      # gom bản vá nhỏ thành một PR cho đỡ ồn
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Electron lên bản lớn cần thử tay (cửa sổ trong suốt, IPC, preload) — tự nâng khi sẵn sàng
      - dependency-name: electron
        update-types: [version-update:semver-major]
      - dependency-name: electron-builder
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
