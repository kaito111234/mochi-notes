<!doctype html><meta charset=utf-8><style>
html,body{margin:0;width:960px;height:540px;overflow:hidden;font-family:"Segoe UI",sans-serif}
.w{position:absolute;inset:0;background:
 radial-gradient(ellipse 520px 380px at 12% 8%,#ffd9e8 0%,rgba(255,217,232,0) 70%),
 radial-gradient(ellipse 600px 420px at 92% 18%,#cfe3ff 0%,rgba(207,227,255,0) 72%),
 radial-gradient(ellipse 700px 420px at 55% 105%,#d9ccff 0%,rgba(217,204,255,0) 70%),
 radial-gradient(ellipse 480px 300px at 0% 85%,#c9f1e6 0%,rgba(201,241,230,0) 70%),
 linear-gradient(160deg,#eef3ff 0%,#f6ecff 50%,#e9f7ff 100%)}
.bloom{position:absolute;border-radius:50%;filter:blur(2px)}
.tb{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(243,243,247,.92);border-top:1px solid rgba(0,0,0,.08)}
.ic{position:absolute;top:10px;width:28px;height:28px;border-radius:7px}
.start{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:6px;box-sizing:border-box;top:10px}
.start i{background:#2b7de9;border-radius:1.5px;display:block}
.tray{position:absolute;right:22px;top:16px;display:flex;gap:10px}
.tray i{width:14px;height:14px;border-radius:4px;background:#8a8a99;opacity:.7;display:block}
.dot{position:absolute;bottom:3px;width:14px;height:3px;border-radius:2px;background:#2b7de9}
</style><div class=w></div>
